    --good:#2F7A4E; --good-soft:#DFEFE3;
    --warn:#9A6A1C; --warn-soft:#F6E9D2;
    --danger:#A6493A; --danger-soft:#F5DFDA;
    --radius:14px; --radius-sm:10px;
    --font-display:'Fraunces',Georgia,'Iowan Old Style',serif;
    --font-body:'Work Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141D1B; --surface:#1B2624; --surface-2:#22302D; --surface-3:#2B3B37;
      --fg:#EAEAE2; --fg-muted:#AEB9B4; --fg-faint:#85918C;
      --accent:#56B0A3; --accent-ink:#0B1413; --accent-soft:#213A36;
      --warm:#D9AD67; --warm-soft:#3A3122;
      --border:#324542;
      --good:#63C08A; --good-soft:#1E3A2A;
      --warn:#E3B968; --warn-soft:#3C3320;
      --danger:#E08D7B; --danger-soft:#3C2621;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141D1B; --surface:#1B2624; --surface-2:#22302D; --surface-3:#2B3B37;
    --fg:#EAEAE2; --fg-muted:#AEB9B4; --fg-faint:#85918C;
    --accent:#56B0A3; --accent-ink:#0B1413; --accent-soft:#213A36;
    --warm:#D9AD67; --warm-soft:#3A3122;
    --border:#324542;
    --good:#63C08A; --good-soft:#1E3A2A;
    --warn:#E3B968; --warn-soft:#3C3320;
    --danger:#E08D7B; --danger-soft:#3C2621;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:16.5px; line-height:1.55;}
  h1,h2,h3{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0;}
  button{font-family:inherit; cursor:pointer; font-size:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--fg); background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; min-height:44px;}
  input[type=checkbox],input[type=radio]{min-height:0;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  ::placeholder{color:var(--fg-faint);}
  a{color:var(--accent);}
  .tabular{font-variant-numeric:tabular-nums;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .muted{color:var(--fg-muted);}
  .small{font-size:14px;}

  /* ---------- App shell ---------- */
  #app{display:flex; min-height:100vh;}
  .rail{width:250px; flex:0 0 250px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; gap:2px; padding:18px 12px; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;}
  .rail-brand{display:flex; align-items:center; gap:10px; padding:4px 8px 16px;}
  .mark{width:38px; height:38px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .mark svg{width:20px; height:20px;}
  .rail-brand .word{font-family:var(--font-display); font-size:17px; font-weight:600; line-height:1.2;}
  .rail-brand .word small{display:block; font-family:var(--font-body); font-size:12.5px; font-weight:500; color:var(--fg-muted);}
  .nav-btn{display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:none; background:transparent; color:var(--fg-muted); padding:10px 11px; border-radius:10px; font-size:15px; font-weight:500; min-height:44px;}
  .nav-btn svg{width:19px; height:19px; flex:0 0 auto; opacity:.85;}
  .nav-btn:hover{background:var(--surface-2); color:var(--fg);}
  .nav-btn.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .nav-group{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--fg-faint); font-weight:600; padding:14px 11px 4px;}
  .rail-foot{margin-top:auto; padding:12px 11px 0; border-top:1px solid var(--border); font-size:12.5px; color:var(--fg-faint);}

  .topbar{display:none; position:sticky; top:0; z-index:6; background:var(--surface); border-bottom:1px solid var(--border); padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px)); align-items:center; justify-content:space-between; gap:10px;}
  .topbar .brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600; font-size:17px;}
  .topbar .mark{width:32px; height:32px; border-radius:9px;}
  .topbar .mark svg{width:17px; height:17px;}
  .menu-btn{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:var(--fg); font-weight:600; font-size:15px; display:flex; align-items:center; gap:7px; min-height:44px;}
  .menu-btn svg{width:18px; height:18px;}
  .drawer-backdrop{position:fixed; inset:0; background:rgba(20,25,23,.45); z-index:30; display:flex; justify-content:flex-end;}
  .drawer{background:var(--surface); width:min(86vw,320px); height:100%; overflow-y:auto; padding:18px 12px calc(24px + env(safe-area-inset-bottom,0px)); padding-top:calc(18px + env(safe-area-inset-top,0px));}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; padding:0 8px 10px;}

  main{flex:1; min-width:0; padding:34px 36px 80px; max-width:1000px; margin:0 auto; width:100%;}
  .section-head{margin-bottom:22px;}
  .eyebrow{font-size:12.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--warm); font-weight:600; margin-bottom:6px;}
  .section-head h1{font-size:29px; line-height:1.2;}
  .section-head p{margin:8px 0 0; color:var(--fg-muted); font-size:16px; max-width:62ch;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px;}
  .card + .card, .card + .grid-cards, .grid-cards + .card{margin-top:16px;}
  .card h3{font-size:18px; display:flex; align-items:center; gap:9px; margin-bottom:12px; flex-wrap:wrap;}
  .card h3 svg{width:19px; height:19px; color:var(--accent); flex:0 0 auto;}
  .card h3 .right{margin-left:auto; font-family:var(--font-body); font-size:14px; font-weight:500;}
  .card-note{font-size:14.5px; color:var(--fg-muted); margin:-4px 0 12px;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .grid-cards{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid-cards .card + .card{margin-top:0;}
  @media (max-width:760px){ .grid-2,.grid-3,.grid-cards{grid-template-columns:1fr;} }
  .field{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .field > label, .field > .lbl{font-size:13px; font-weight:600; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.04em;}
  .field input,.field select,.field textarea{width:100%;}
  .field textarea{resize:vertical; min-height:80px;}
  .field .hint{font-size:13.5px; color:var(--fg-faint); text-transform:none; letter-spacing:0; font-weight:400;}
  .stack > * + *{margin-top:14px;}
  fieldset{border:1px solid var(--border); border-radius:12px; padding:14px 16px 16px; margin:0;}
  legend{font-size:13px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; padding:0 6px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:600; border:1px solid var(--border); background:var(--surface-2); color:var(--fg); min-height:44px; text-decoration:none;}
  .btn svg{width:17px; height:17px;}
  .btn:hover{background:var(--surface-3);}
  .btn-accent{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-accent:hover{background:var(--accent); filter:brightness(1.07);}
  .btn-danger{background:var(--danger); border-color:var(--danger); color:#fff;}
  .btn-danger:hover{background:var(--danger); filter:brightness(1.07);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--fg-muted);}
  .btn-ghost:hover{background:var(--surface-2); color:var(--fg);}
  .btn-sm{padding:7px 12px; font-size:14px; min-height:40px;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .linkish{background:none; border:none; padding:0; color:var(--accent); text-decoration:underline; font-weight:600; min-height:0; font-size:inherit;}
  .icon-btn{display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:10px; border:none; background:transparent; color:var(--fg-muted);}
  .icon-btn svg{width:18px; height:18px;}
  .icon-btn:hover{background:var(--surface-2); color:var(--fg);}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn.danger:hover{background:var(--danger-soft);}

  .row-item{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--border);}
  .row-item:last-child{border-bottom:none;}
  .row-item .meta{min-width:0; flex:1;}
  .row-item .title{font-weight:600; font-size:16.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .row-item .sub{color:var(--fg-muted); font-size:14.5px; margin-top:3px;}
  .row-item .actions{display:flex; gap:2px; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end;}

  .badge{display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:999px; font-family:var(--font-body); white-space:nowrap;}
  .badge-good{background:var(--good-soft); color:var(--good);}
  .badge-warn{background:var(--warn-soft); color:var(--warn);}
  .badge-danger{background:var(--danger-soft); color:var(--danger);}
  .badge-muted{background:var(--surface-2); color:var(--fg-muted);}
  .badge-accent{background:var(--accent-soft); color:var(--accent);}

  .empty{padding:22px 10px; text-align:center; color:var(--fg-muted); font-size:15px;}

  .banner{display:flex; align-items:flex-start; gap:10px; background:var(--warm-soft); border:1px solid color-mix(in srgb, var(--warm) 35%, var(--border)); color:var(--fg); border-radius:var(--radius-sm); padding:13px 15px; font-size:15px; margin-bottom:16px; flex-wrap:wrap;}
  .banner > svg{width:18px; height:18px; color:var(--warm); flex:0 0 auto; margin-top:2px;}
  .banner .b-text{flex:1; min-width:200px;}
  .banner .b-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .banner.info{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 30%, var(--border));}
  .banner.info > svg{color:var(--accent);}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px;}
  @media (max-width:760px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; text-align:left; color:var(--fg); font:inherit;}
  button.stat:hover{border-color:var(--accent);}
  .stat .num{font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1.1;}
  .stat .lbl{font-size:13px; color:var(--fg-muted); margin-top:4px;}

  /* dose rows */
  .dose{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);}
  .dose:last-child{border-bottom:none;}
  .dose .time{font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; width:78px; flex:0 0 auto; color:var(--fg-muted);}
  .dose .what{flex:1; min-width:0;}
  .dose .what .n{font-weight:600;}
  .dose .what .s{font-size:14px; color:var(--fg-muted);}
  .give-btn{flex:0 0 auto; min-width:104px; border-radius:999px; border:1.5px solid var(--accent); background:transparent; color:var(--accent); font-weight:700; padding:9px 14px; font-size:14.5px; min-height:44px; display:inline-flex; align-items:center; gap:6px; justify-content:center;}
  .give-btn svg{width:16px; height:16px;}
  .give-btn:hover{background:var(--accent-soft);}
  .give-btn.given{background:var(--good-soft); border-color:transparent; color:var(--good);}
  .dose.is-given .what .n{color:var(--fg-muted);}
  .giver-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-bottom:8px;}
  .giver-bar label{font-size:14.5px; font-weight:600;}
  .giver-bar input{flex:1; min-width:150px;}

  .checkline{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
  .checkline:last-child{border-bottom:none;}
  .checkline input[type=checkbox]{width:22px; height:22px; accent-color:var(--accent); flex:0 0 auto; margin-top:2px;}
  .checkline label{font-size:16px; flex:1; min-width:0;}
  .checkline.done label{color:var(--fg-faint); text-decoration:line-through;}

  .form-inline{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .form-inline input{flex:1; min-width:200px;}

  .progress{height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .progress > i{display:block; height:100%; background:var(--accent); border-radius:99px;}

  table{width:100%; border-collapse:collapse; font-size:15px;}
  thead th{text-align:left; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-muted); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--border); white-space:nowrap;}
  tbody td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .ov-x{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  /* history grid */
  .hist th, .hist td{text-align:center; padding:6px 4px; border-bottom:none;}
  .hist th.medcol, .hist td.medcol{text-align:left; padding-left:0; min-width:140px; position:sticky; left:0; background:var(--surface); z-index:1;}
  .hist thead th{font-size:12px; text-transform:none; letter-spacing:0;}
  .hcell{display:inline-flex; align-items:center; justify-content:center; width:40px; height:34px; border-radius:8px; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;}
  .h-full{background:var(--good-soft); color:var(--good);}
  .h-part{background:var(--warn-soft); color:var(--warn);}
  .h-none{background:var(--surface-2); color:var(--fg-faint);}
  .h-na{color:var(--fg-faint); background:transparent;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--fg-muted); margin-top:12px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:14px; height:14px; border-radius:4px; display:inline-block;}

  .toast-wrap{position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; width:min(92vw,440px);}
  .toast{background:var(--fg); color:var(--bg); padding:12px 16px; border-radius:12px; font-size:15px; display:flex; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); width:100%; justify-content:space-between;}
  .toast button{background:none; border:none; color:var(--bg); font-weight:700; text-decoration:underline; flex:0 0 auto; padding:4px;}

  .dialog-backdrop{position:fixed; inset:0; background:rgba(20,25,23,.45); display:flex; align-items:flex-end; justify-content:center; z-index:40;}
  @media (min-width:640px){ .dialog-backdrop{align-items:center; padding:20px;} }
  .dialog{background:var(--surface); width:100%; max-width:540px; border-radius:18px 18px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px)); max-height:90vh; overflow-y:auto; border:1px solid var(--border);}
  @media (min-width:640px){ .dialog{border-radius:18px;} }
  .dialog h3{font-size:20px; margin-bottom:6px;}
  .dialog .d-intro{font-size:15px; color:var(--fg-muted); margin:0 0 14px;}
  .dialog .field + .field, .dialog .field + .grid-2, .dialog .grid-2 + .field, .dialog .grid-2 + .grid-2, .dialog fieldset + .field, .dialog .field + fieldset{margin-top:14px;}
  .dialog-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap;}
  .chk{display:flex; align-items:center; gap:10px; font-size:16px; font-weight:500; color:var(--fg); text-transform:none; letter-spacing:0; padding:4px 0;}
  .chk input{width:20px; height:20px; accent-color:var(--accent);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1px solid var(--border); background:var(--surface-2); color:var(--fg); border-radius:999px; padding:7px 13px; font-size:14.5px; font-weight:500; min-height:40px;}
  .chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .time-list{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .time-row{display:flex; gap:8px; align-items:center;}
  .time-row input{flex:1;}
  .seg{display:flex; border:1px solid var(--border); border-radius:12px; overflow:hidden; flex-wrap:wrap;}
  .seg label{flex:1; text-align:center; padding:10px 8px; font-size:15px; font-weight:600; color:var(--fg-muted); cursor:pointer; border-right:1px solid var(--border); text-transform:none; letter-spacing:0; min-width:90px;}
  .seg label:last-child{border-right:none;}
  .seg input{position:absolute; opacity:0; pointer-events:none;}
  .seg label:has(input:checked){background:var(--accent-soft); color:var(--accent);}
  .seg label:has(input:focus-visible){outline:2px solid var(--accent); outline-offset:-2px;}
  .warnbox{background:var(--warn-soft); color:var(--fg); border-radius:10px; padding:11px 13px; font-size:15px; margin-top:12px; border:1px solid color-mix(in srgb, var(--warn) 35%, var(--border));}

  footer.app-foot{max-width:1000px; margin:10px auto 0; padding:0 36px 28px; color:var(--fg-muted); font-size:13.5px; text-align:center;}
  footer.app-foot .shop{display:block; margin-top:4px; color:var(--fg-faint); letter-spacing:.06em; text-transform:uppercase; font-size:11.5px;}

  @media (max-width:900px){
    .rail{display:none;}
    .topbar{display:flex;}
    main{padding:20px 16px 70px;}
    footer.app-foot{padding:0 16px 28px;}
    .section-head h1{font-size:25px;}
    .card{padding:18px 16px;}
  }
  @media (max-width:520px){
    .dose{flex-wrap:wrap;}
    .dose .time{width:auto;}
    .dose .what{flex-basis:calc(100% - 140px);}
  }

  /* ---------- Print ---------- */
  #printArea{display:none;}
  @media print{
    @page{margin:14mm;}
    body{background:#fff; color:#111; font-size:12pt;}
    #app, .toast-wrap, #dialogRoot, #drawerRoot{display:none !important;}
    #printArea{display:block;}
    .p-head{border-bottom:2px solid #2E6F67; padding-bottom:8px; margin-bottom:14px;}
    .p-head h1{font-family:var(--font-display); color:#2E6F67; font-size:22pt;}
    .p-head .p-sub{color:#555; font-size:10.5pt; margin-top:4px;}
    .p-sec{margin-top:16px; break-inside:avoid;}
    .p-sec h2{font-family:var(--font-display); color:#2E6F67; font-size:14pt; margin-bottom:6px;}
    .p-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 24px; font-size:11pt;}
    .p-grid b{color:#2E6F67; font-weight:600; font-size:9pt; text-transform:uppercase; letter-spacing:.04em; display:block;}
    .p-table{width:100%; border-collapse:collapse; font-size:10.5pt;}
    .p-table th{background:#2E6F67; color:#fff; text-align:left; padding:6px 8px; font-size:9pt; text-transform:uppercase; letter-spacing:.04em; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .p-table td{border-bottom:1px solid #ccc; padding:7px 8px; vertical-align:top;}
    .p-foot{margin-top:18px; font-size:9pt; color:#666; border-top:1px solid #ccc; padding-top:6px;}
    .p-alert{border:1.5px solid #A87A34; border-radius:6px; padding:8px 10px; font-size:11.5pt; margin-bottom:10px;}
  }
</style>
</head>
<body>
<div id="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">
    <header class="topbar">
      <div class="brand"><span class="mark" id="topMark"></span><span>Command Center</span></div>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu"></button>
    </header>
    <main id="main"></main>
    <footer class="app-foot">Private to this device. Nothing you enter here is sent anywhere. Not legal or medical advice.<span class="shop">The Steady Shelf</span></footer>
  </div>
</div>
<div id="drawerRoot"></div>
<div id="toastWrap" class="toast-wrap" role="status" aria-live="polite"></div>
<div id="dialogRoot"></div>
<div id="printArea"></div>
<input type="file" id="restoreInput" accept="application/json,.json" style="display:none">
<script>
(function(){
  "use strict";

  /* ================= DATES (always the person's own local clock) ================= */
  function pad(n){ return String(n).padStart(2,"0"); }
  function localISO(d){ d = d || new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayISO(){ return localISO(new Date()); }
  function nowHHMM(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
  function nowStamp(){ return todayISO()+"T"+nowHHMM(); }
  function parseISO(iso){ if(!iso) return null; const [y,m,d] = iso.split("-").map(Number); const dt = new Date(y,(m||1)-1,d||1); return isNaN(dt)?null:dt; }
  function parseStamp(s){ if(!s) return null; const [dp,tp] = s.split("T"); const d = parseISO(dp); if(!d) return null; if(tp){ const [h,mi]=tp.split(":").map(Number); d.setHours(h||0, mi||0, 0, 0); } return d; }
  function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return localISO(d); }
  function daysBetween(aISO, bISO){ return Math.round((parseISO(bISO) - parseISO(aISO))/86400000); }
  function fmtDate(iso, opts){
    const d = parseISO(iso); if(!d) return "Not set";
    return d.toLocaleDateString(undefined, opts || {month:"short", day:"numeric", year:"numeric"});
  }
  function fmtDay(iso){ const d=parseISO(iso); return d? d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"}) : ""; }
  function fmtTime(hhmm){
    if(!hhmm) return "";
    const [h,m] = hhmm.split(":").map(Number); const d = new Date(); d.setHours(h,m,0,0);
    return d.toLocaleTimeString(undefined,{hour:"numeric", minute:"2-digit"});
  }
  function fmtStamp(s){ const d=parseStamp(s); if(!d) return ""; const iso = s.split("T")[0]; const t = s.split("T")[1]; const today=todayISO();
    const day = iso===today ? "Today" : iso===addDays(today,-1) ? "Yesterday" : fmtDate(iso,{month:"short",day:"numeric"});
    return day + (t? ", "+fmtTime(t):""); }
  function relDays(iso){
    const n = daysBetween(todayISO(), iso);
    if(n===0) return "today"; if(n===1) return "tomorrow"; if(n===-1) return "yesterday";
    return n>0 ? `in ${n} days` : `${-n} days ago`;
  }

  /* ================= MEDICATION LOGIC ================= */
  function medById(id){ return state.medications.find(m=>m.id===id); }
  function activeMeds(){ return state.medications.filter(m=>m.status!=="stopped"); }
  function medOnDate(m, iso){
    if(m.startDate && iso < m.startDate) return false;
    if(m.status==="stopped"){ if(!m.stopDate) return false; if(iso >= m.stopDate) return false; }
    return true;
  }
  function dosesFor(iso){
    const dow = parseISO(iso).getDay(); const rows = [];
    state.medications.forEach(m=>{
      if(m.schedule==="prn" || !medOnDate(m, iso)) return;
      if(m.schedule==="days" && !(m.days||[]).includes(dow)) return;
      (m.times||[]).forEach(t=> rows.push({m, t, key:m.id+"@"+t}));
    });
    return rows.sort((a,b)=> a.t.localeCompare(b.t) || a.m.name.localeCompare(b.m.name));
  }
  function doseEntry(iso, key){ return (state.doseLog[iso]||{})[key] || null; }
  function giveDose(iso, key, at){
    const m = medById(key.split("@")[0]);
    if(!state.doseLog[iso]) state.doseLog[iso] = {};
    state.doseLog[iso][key] = {by: state.giver||"", at: at || nowStamp()};
    if(m && m.count!=null){ m.count = Math.max(0, Number(m.count) - Number(m.perDose||1)); }
    save();
  }
  function ungiveDose(iso, key){
    const m = medById(key.split("@")[0]);
    if(state.doseLog[iso] && state.doseLog[iso][key]){
      delete state.doseLog[iso][key];
      if(m && m.count!=null){ m.count = Number(m.count) + Number(m.perDose||1); }
      save();
    }
  }
  function dailyUse(m){
    if(m.schedule==="prn") return null;
    const per = Number(m.perDose||1) * (m.times||[]).length;
    if(!per) return null;
    return m.schedule==="days" ? per * ((m.days||[]).length/7) : per;
  }
  function daysLeft(m){ const u = dailyUse(m); if(m.count==null || !u) return null; return Math.floor(Number(m.count)/u); }
  function refillInfo(m){
    if(m.status==="stopped") return {soon:false};
    const dl = daysLeft(m); const t = todayISO();
    const byDate = m.refill ? daysBetween(t, m.refill) : null;
    let soon = false, text = "";
    if(byDate!=null && byDate<=5){ soon = true; text = byDate<0 ? `Refill date was ${fmtDate(m.refill,{month:"short",day:"numeric"})}` : `Refill due ${relDays(m.refill)}`; }
    if(dl!=null && dl<=5){ soon = true; text = dl<=0 ? "Out of pills, by your count" : `About ${dl} day${dl===1?"":"s"} of pills left`; }
    return {soon, text, daysLeft:dl};
  }
  function times(m){
    if(m.schedule==="prn") return "As needed";
    const t = (m.times||[]).map(fmtTime).join(", ") || "No times set";
    const d = m.schedule==="days" ? ((m.days||[]).slice().sort().map(i=>DOW[i]).join(", ") || "No days set") : "Every day";
    return t+" · "+d;
  }
  function prnEntries(medId){ return state.prnLog.filter(p=>p.medId===medId).sort((a,b)=>b.at.localeCompare(a.at)); }
  function prnWarning(m, atStamp, excludeId){
    if(!m) return "";
    const list = prnEntries(m.id).filter(p=>p.id!==excludeId && (!atStamp || p.at <= atStamp));
    const last = list[0];
    const msgs = [];
    if(last && m.prnMinHours){
      const h = Math.max(0, atStamp ? (parseStamp(atStamp)-parseStamp(last.at))/3600000 : hoursSince(last.at));
      if(h < m.prnMinHours) msgs.push(`Last dose was ${fmtHours(h)} ago (${fmtStamp(last.at)}${last.by?" by "+esc(last.by):""}). The directions say to wait ${m.prnMinHours} hours between doses.`);
    }
    if(m.prnMaxPerDay){
      const day = (atStamp||nowStamp()).split("T")[0];
      const n = state.prnLog.filter(p=>p.medId===m.id && p.id!==excludeId && p.at.startsWith(day)).length;
      if(n >= m.prnMaxPerDay) msgs.push(`${n} dose${n===1?"":"s"} already logged that day. The directions say no more than ${m.prnMaxPerDay} a day.`);
    }
    return msgs.join(" ");
  }
  function logChange(medName, change, note, date){
    state.medChanges.push({id:uid(), date:date||todayISO(), medName, change, note:note||""});
  }
  function rememberGiver(name){
    name = (name||"").trim(); state.giver = name;
    if(name && !state.givers.includes(name)) state.givers.push(name);
    save();
  }

  function dosesListHTML(iso, compact){
    if(!activeMeds().length) return `<div class="empty">No medications added yet.<br><button type="button" class="btn btn-sm" style="margin-top:10px;" data-act="addMed">${icon("plus")} Add a medication</button></div>`;
    const rows = dosesFor(iso);
    const isToday = iso===todayISO();
    const now = nowHHMM();
    let h = isToday ? giverBarHTML() : "";
    if(!rows.length) return h + `<div class="empty">No scheduled doses ${isToday?"today":"this day"}. As-needed medicines are logged on the Medications page.</div>`;
    h += rows.map(({m,t,key})=>{
      const e = doseEntry(iso,key);
      const late = isToday && !e && minutesDiff(t, now) > 60;
      const sub = e ? `Given ${fmtStamp(e.at)}${e.by?" by "+esc(e.by):""}` :
        [m.instructions?esc(m.instructions):"", late?`<span class="badge badge-warn">Not logged yet</span>`:""].filter(Boolean).join(" · ");
      return `<div class="dose ${e?'is-given':''}">
        <div class="time">${fmtTime(t)}</div>

      </div>`;
    }).join("");
    return h;
  }
  function minutesDiff(a, b){ const [ah,am]=a.split(":").map(Number), [bh,bm]=b.split(":").map(Number); return (bh*60+bm)-(ah*60+am); }

  /* ---------- medication dialogs ---------- */
  function medDialog(existing){
    const m = existing ? clone(existing) : {name:"",dose:"",schedule:"daily",days:[],times:["08:00"],instructions:"",purpose:"",prescriber:"",rxNumber:"",startDate:todayISO(),count:null,perDose:1,refill:"",prnMinHours:null,prnMaxPerDay:null};
    const timeRow = (v)=>`<div class="time-row"><input type="time" name="time" value="${attr(v)}" aria-label="Dose time"><button type="button" class="icon-btn danger" data-rm-time aria-label="Remove this time">${icon("close")}</button></div>`;
    openDialog({
      title: existing ? "Edit medication" : "Add a medication",
      body: `
        <div class="field"><label for="m-name">Medication name</label><input id="m-name" name="name" value="${attr(m.name)}" required placeholder="e.g. Metformin"></div>
        <div class="grid-2">
          <div class="field"><label for="m-dose">Dose</label><input id="m-dose" name="dose" value="${attr(m.dose)}" placeholder="e.g. 500 mg"></div>
          <div class="field"><label for="m-inst">Instructions</label><input id="m-inst" name="instructions" value="${attr(m.instructions)}" placeholder="e.g. With food"></div>
        </div>
        <div class="field"><span class="lbl">How often</span>
          <div class="seg">
            <label><input type="radio" name="schedule" value="daily" ${m.schedule==="daily"?"checked":""}>Every day</label>
            <label><input type="radio" name="schedule" value="days" ${m.schedule==="days"?"checked":""}>Certain days</label>
            <label><input type="radio" name="schedule" value="prn" ${m.schedule==="prn"?"checked":""}>As needed</label>
          </div></div>
        <div class="field" data-show="days"><span class="lbl">Which days</span>
          <div class="chips">${DOW.map((d,i)=>`<label class="chip ${m.days.includes(i)?'on':''}" style="cursor:pointer;"><input type="checkbox" name="day" value="${i}" ${m.days.includes(i)?"checked":""} style="position:absolute;opacity:0;width:1px;height:1px;">${d}</label>`).join("")}</div></div>
        <div class="field" data-show="sched"><span class="lbl">Dose times</span>
          <div class="chips">${TIME_PRESETS.map(([l,v])=>`<button type="button" class="chip" data-add-time="${v}">${icon("plus").replace('<svg','<svg style="width:14px;height:14px;vertical-align:-2px;"')} ${l}</button>`).join("")}</div>
          <div class="time-list" id="timeList">${(m.times.length?m.times:[]).map(timeRow).join("")}</div>
          <button type="button" class="linkish" style="margin-top:8px; align-self:flex-start;" data-add-time="">Add another time</button>
        </div>
        <div class="grid-2" data-show="prn">
          <div class="field"><label for="m-minh">Hours between doses</label><input id="m-minh" type="number" min="0" step="0.5" inputmode="decimal" name="prnMinHours" value="${attr(m.prnMinHours??"")}" placeholder="e.g. 6"><span class="hint">From the label. Used for a gentle warning.</span></div>
          <div class="field"><label for="m-maxd">Max doses a day</label><input id="m-maxd" type="number" min="0" step="1" inputmode="numeric" name="prnMaxPerDay" value="${attr(m.prnMaxPerDay??"")}" placeholder="e.g. 4"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="m-purpose">What it's for</label><input id="m-purpose" name="purpose" value="${attr(m.purpose)}" placeholder="e.g. Blood pressure"></div>
          <div class="field"><label for="m-pres">Prescribing doctor</label><input id="m-pres" name="prescriber" value="${attr(m.prescriber)}"></div>
        </div>
        <fieldset><legend>Supply & refills (optional)</legend>
          <div class="grid-2">
            <div class="field"><label for="m-count">Pills on hand</label><input id="m-count" type="number" min="0" inputmode="numeric" name="count" value="${attr(m.count??"")}"><span class="hint">Counts down as doses are marked given.</span></div>
            <div class="field"><label for="m-per">Pills per dose</label><input id="m-per" type="number" min="0" step="0.5" inputmode="decimal" name="perDose" value="${attr(m.perDose??1)}"></div>
            <div class="field"><label for="m-refill">Next refill date</label><input id="m-refill" type="date" name="refill" value="${attr(m.refill)}"></div>
            <div class="field"><label for="m-rx">Rx number</label><input id="m-rx" name="rxNumber" value="${attr(m.rxNumber)}"></div>
          </div>
        </fieldset>
        <div class="field"><label for="m-start">Started on</label><input id="m-start" type="date" name="startDate" value="${attr(m.startDate)}"></div>`,
      onOpen(form){
        const list = form.querySelector("#timeList");
        const sync = ()=>{
          const s = form.querySelector("input[name=schedule]:checked").value;
          form.querySelector("[data-show=days]").style.display = s==="days" ? "" : "none";
          form.querySelector("[data-show=sched]").style.display = s==="prn" ? "none" : "";
          form.querySelector("[data-show=prn]").style.display = s==="prn" ? "" : "none";
        };
        form.querySelectorAll("input[name=schedule]").forEach(r=> r.onchange = sync); sync();
        form.querySelectorAll("input[name=day]").forEach(cb=> cb.onchange = ()=> cb.parentElement.classList.toggle("on", cb.checked));
        form.addEventListener("click", e=>{
          const add = e.target.closest("[data-add-time]");
          if(add){ e.preventDefault(); const v = add.dataset.addTime;
            if(v && [...list.querySelectorAll("input")].some(i=>i.value===v)) return;
            list.insertAdjacentHTML("beforeend", timeRow(v)); if(!v) list.lastElementChild.querySelector("input").focus(); }
          const rm = e.target.closest("[data-rm-time]");
          if(rm){ e.preventDefault(); rm.parentElement.remove(); }
        });
      },
      onSubmit(fd, close){
        const schedule = val(fd,"schedule")||"daily";
        const timesArr = [...new Set(fd.getAll("time").map(String).filter(Boolean))].sort();
        const obj = {
          name: val(fd,"name"), dose: val(fd,"dose"), instructions: val(fd,"instructions"), schedule,
          days: fd.getAll("day").map(Number), times: schedule==="prn" ? [] : timesArr,
          purpose: val(fd,"purpose"), prescriber: val(fd,"prescriber"), rxNumber: val(fd,"rxNumber"),
          startDate: val(fd,"startDate") || todayISO(), count: numOrNull(val(fd,"count")), perDose: numOrNull(val(fd,"perDose")) ?? 1,
          refill: val(fd,"refill"), prnMinHours: numOrNull(val(fd,"prnMinHours")), prnMaxPerDay: numOrNull(val(fd,"prnMaxPerDay"))
        };
        if(schedule!=="prn" && !obj.times.length){ toast("Add at least one dose time, or choose \"As needed.\""); return; }
        if(schedule==="days" && !obj.days.length){ toast("Pick at least one day."); return; }
        if(existing){
          if((existing.dose||"") !== obj.dose) logChange(obj.name, `Dose changed from ${existing.dose||"not set"} to ${obj.dose||"not set"}`);
          const before = times(existing), after = times(Object.assign({}, existing, obj));
          if(before !== after) logChange(obj.name, `Schedule changed to ${after}`);
          Object.assign(existing, obj);
          toast("Medication updated.");
        } else {
          state.medications.push(Object.assign({id:uid(), status:"active", stopDate:"", stopReason:""}, obj));
          logChange(obj.name, `Started ${obj.dose||""}`.trim(), obj.prescriber?("Prescribed by "+obj.prescriber):"", obj.startDate);
          toast(obj.name+" added.");
        }
        save(); close(); render();
      }
    });
  }
  function stopMedDialog(m){

      body:`<div class="field"><label for="s-date">Last day it was taken</label><input id="s-date" type="date" name="date" value="${todayISO()}"><span class="hint">Doses stop showing from the day after.</span></div>
        <div class="field"><label for="s-why">Reason</label><input id="s-why" name="why" placeholder="e.g. Doctor stopped it, side effects"></div>`,
      submitLabel:"Stop medication",

  function prnDialog(medId, existing){
    const prn = state.medications.filter(m=>m.schedule==="prn" && (m.status!=="stopped" || (existing && existing.medId===m.id)));
    const e = existing || {medId, at:nowStamp(), amount:"", reason:"", by:state.giver, helped:""};
    openDialog({title: existing?"Edit as-needed dose":"Log an as-needed dose",
      body:`<div class="field"><label for="p-med">Medicine</label><select id="p-med" name="medId">${prn.map(m=>`<option value="${m.id}" ${m.id===e.medId?"selected":""}>${esc(m.name)} ${esc(m.dose||"")}</option>`).join("")}</select></div>

          <div class="field"><label for="p-at">Date and time given</label><input id="p-at" type="datetime-local" name="at" value="${attr(e.at)}" required></div>

          <div class="field"><label for="p-help">Did it help?</label><select id="p-help" name="helped">${["","Yes","A little","No","Too soon to tell"].map(o=>`<option value="${o}" ${e.helped===o?"selected":""}>${o||"Not noted"}</option>`).join("")}</select></div>
        </div>`,
      onOpen(form){
        const upd = ()=>{ const m = medById(form.querySelector("[name=medId]").value); const at = form.querySelector("[name=at]").value;
          const w = prnWarning(m, at, existing && existing.id);
          form.querySelector("#prnWarn").innerHTML = w ? `<div class="warnbox">${w} Please check with the doctor or pharmacist if you're unsure.</div>` : ""; };
        form.querySelector("[name=medId]").onchange = upd; form.querySelector("[name=at]").onchange = upd; upd();
      },
      onSubmit(fd, close){
        const m = medById(val(fd,"medId")); if(!m) return;
        const obj = {medId:m.id, medName:m.name, at:val(fd,"at").slice(0,16), amount:val(fd,"amount"), reason:val(fd,"reason"), by:val(fd,"by"), helped:val(fd,"helped")};
        if(obj.by) { if(!state.givers.includes(obj.by)) state.givers.push(obj.by); }
        if(existing) Object.assign(existing, obj); else state.prnLog.push(Object.assign({id:uid()}, obj));
        save(); close(); render(); toast("As-needed dose logged.");
      }});
  }
  function dayDialog(iso){
    const rows = dosesFor(iso);
    openDialog({title:`Doses for ${fmtDay(iso)}`, intro: rows.length ? "Tick what was given. Untick anything marked by mistake." : "",
      body: rows.length ? rows.map(({m,t,key})=>{ const e = doseEntry(iso,key);
        return `<label class="checkline" style="cursor:pointer;"><input type="checkbox" name="k" value="${attr(key)}" ${e?"checked":""}><span style="flex:1;"><strong>${fmtTime(t)}</strong> · ${esc(m.name)} ${esc(m.dose||"")}${e?`<br><span class="muted small">Given ${fmtStamp(e.at)}${e.by?" by "+esc(e.by):""}</span>`:""}</span></label>`; }).join("")
        : `<div class="empty">No scheduled doses on this day.</div>`,
      submitLabel:"Save", hideSubmit: !rows.length, cancelLabel: rows.length?"Cancel":"Close",
      onSubmit(fd, close){
        const on = new Set(fd.getAll("k").map(String));
        rows.forEach(({t,key})=>{ const e = doseEntry(iso,key);
          if(on.has(key) && !e) giveDose(iso, key, iso===todayISO()? nowStamp() : iso+"T"+t);
          if(!on.has(key) && e) ungiveDose(iso, key); });
        save(); close(); render(); toast("Doses updated.");
      }});
  }

  /* ================= BILLS ================= */
  const FREQ = {monthly:{label:"Monthly", m:1}, quarterly:{label:"Every 3 months", m:3}, yearly:{label:"Yearly", m:12}, once:{label:"One time", m:0}};
  function nextOcc(b, fromISO){
    if(!b.due) return null;
    const step = (FREQ[b.freq]||FREQ.monthly).m;
    if(!step) return b.due;
    const base = parseISO(b.due), day = base.getDate();
    for(let k=0;k<1200;k++){
      const y = base.getFullYear(), mo = base.getMonth()+k*step;
      const dim = new Date(y, mo+1, 0).getDate();
      const iso = localISO(new Date(y, mo, Math.min(day, dim)));
      if(iso >= fromISO) return iso;
    }
    return null;
  }
  function currentOcc(b){
    // the earliest unpaid occurrence from a week ago onward
    let from = addDays(todayISO(), -7);
    for(let i=0;i<60;i++){ const o = nextOcc(b, from); if(!o) return null; if(!(b.paid||{})[o]) return o; if(b.freq==="once") return null; from = addDays(o,1); }
    return null;
  }
  function billsDue(days){
    const limit = addDays(todayISO(), days);
    return state.bills.filter(b=>!b.autopay).map(b=>({b, occ:currentOcc(b)})).filter(x=>x.occ && x.occ<=limit).sort((a,b)=>a.occ.localeCompare(b.occ));
  }
  function renderBills(){
    const monthly = state.bills.reduce((n,b)=>{ const s=(FREQ[b.freq]||FREQ.monthly).m; return s? n + Number(b.amount||0)/s : n; },0);
    return `
      <div class="section-head"><div class="eyebrow">Keeping the money side on track</div><h1>Recurring bills & expenses</h1>
        <p>For when "help with Mom's stuff" quietly becomes "managing Mom's bills." About <strong class="tabular">${money(monthly)}</strong> a month across ${state.bills.length} item${state.bills.length===1?"":"s"}.</p></div>
      <div class="card">
        ${state.bills.length ? state.bills.map(b=>{ const occ = currentOcc(b); const t=todayISO();
          const status = b.autopay ? `<span class="badge badge-good">Autopay</span>` : occ ? (occ<t?`<span class="badge badge-warn">Was due ${relDays(occ)}</span>`:`<span class="badge badge-muted">Due ${relDays(occ)}</span>`) : `<span class="badge badge-good">Paid</span>`;
          return `<div class="row-item"><div class="meta"><div class="title">${esc(b.name)} <span class="tabular muted" style="font-weight:500;">${money(b.amount)}</span> ${status}</div>
            <div class="sub">${(FREQ[b.freq]||FREQ.monthly).label}${occ?` · Next due ${fmtDate(occ)}`:""}${b.account?" · Paid from: "+esc(b.account):""}${b.notes?"<br>"+esc(b.notes):""}</div></div>
            <div class="actions">${!b.autopay&&occ?`<button type="button" class="btn btn-sm" data-act="payBill" data-id="${b.id}" data-occ="${occ}">${icon("check")} Mark paid</button>`:""}
            <button type="button" class="icon-btn" data-act="editBill" data-id="${b.id}" aria-label="Edit ${attr(b.name)}">${icon("edit")}</button>
            <button type="button" class="icon-btn danger" data-act="delBill" data-id="${b.id}" aria-label="Delete ${attr(b.name)}">${icon("trash")}</button></div></div>`; }).join("")
          : `<div class="empty">No bills tracked yet.</div>`}
        <div class="btn-row"><button type="button" class="btn btn-accent" data-act="addBill">${icon("plus")} Add a bill</button></div>
      </div>`;
  }

        <div class="grid-2"><div class="field"><label for="b-a">Amount ($)</label><input id="b-a" type="number" step="0.01" min="0" inputmode="decimal" name="amount" value="${attr(b?.amount)}"></div>

  function download(name, text, type){
    const blob = new Blob([text], {type}); const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  function doBackup(){
    state.lastBackup = new Date().toISOString(); save();
    download(`caregiver-command-center-backup-${todayISO()}.json`, JSON.stringify({app:"caregiver-command-center", version:2, exportedAt:state.lastBackup, data:state}, null, 1), "application/json");
    toast("Backup downloaded. Keep the file somewhere safe."); render();
  }
  document.getElementById("restoreInput").addEventListener("change", e=>{
    const file = e.target.files[0]; e.target.value = ""; if(!file) return;
    const r = new FileReader();
    r.onload = ()=>{
      let parsed; try{ parsed = JSON.parse(r.result); }catch(err){ toast("That file couldn't be read. Choose the .json backup file."); return; }
      if(!parsed || parsed.app!=="caregiver-command-center" || !parsed.data){ toast("That doesn't look like a Caregiver Command Center backup."); return; }
      confirmDialog("Restore this backup?", `This replaces everything on this device with the backup from ${fmtDate((parsed.exportedAt||"").slice(0,10))}.`, "Restore backup", ()=>{
        state = normalize(parsed.data); save(); render(); toast("Backup restored.");
      });
    };
    r.readAsText(file);
  });

  /* ================= CALENDAR (.ics) ================= */
  function icsText(title, dateISO, timeHHMM, location, desc){
    const d = dateISO.replace(/-/g,"");
    const escI = s=>(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
    let dt;
    if(timeHHMM){ const st = parseStamp(dateISO+"T"+timeHHMM); const en = new Date(st.getTime()+3600000);
      const f = x=> localISO(x).replace(/-/g,"")+"T"+pad(x.getHours())+pad(x.getMinutes())+"00";
      dt = `DTSTART:${f(st)}\r\nDTEND:${f(en)}`; }
    else dt = `DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${addDays(dateISO,1).replace(/-/g,"")}`;
    const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
    return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//The Steady Shelf//Caregiver Command Center//EN\r\nBEGIN:VEVENT\r\nUID:${uid()}@caregiver-command-center\r\nDTSTAMP:${stamp}\r\n${dt}\r\nSUMMARY:${escI(title)}\r\n${location?`LOCATION:${escI(location)}\r\n`:""}${desc?`DESCRIPTION:${escI(desc)}\r\n`:""}BEGIN:VALARM\r\nTRIGGER:-P1D\r\nACTION:DISPLAY\r\nDESCRIPTION:${escI(title)}\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
  }
  function slug(s){ return (s||"event").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40); }

  /* ================= PRINT ================= */
  function printNow(html){
    document.getElementById("printArea").innerHTML = html;
    setTimeout(()=> window.print(), 60);
  }
  function printHead(title){
    const p = state.profile;
    return `<div class="p-head"><h1>${title}</h1><div class="p-sub">${p.name?esc(p.name):""}${p.dob?" · Born "+fmtDate(p.dob):""} · Printed ${fmtDate(todayISO())}</div></div>`;
  }
  function medTableHTML(){
    const meds = activeMeds();
    if(!meds.length) return "<p>No current medications recorded.</p>";
    return `<table class="p-table"><thead><tr><th>Medication</th><th>Dose</th><th>When</th><th>For</th><th>Prescriber</th></tr></thead><tbody>
      ${meds.sort((a,b)=>(a.schedule==="prn")-(b.schedule==="prn")||a.name.localeCompare(b.name)).map(m=>`<tr><td><strong>${esc(m.name)}</strong>${m.instructions?"<br>"+esc(m.instructions):""}</td><td>${esc(m.dose)}</td><td>${times(m)}${m.schedule==="prn"&&m.prnMinHours?`<br>Wait ${m.prnMinHours} hr between doses`:""}</td><td>${esc(m.purpose)}</td><td>${esc(m.prescriber)}</td></tr>`).join("")}
      </tbody></table>`;
  }
  function printMeds(){
    const p = state.profile;
    printNow(`${printHead("Medication list")}
      <div class="p-alert"><strong>Allergies:</strong> ${esc(p.allergies)||"None recorded"}</div>
      ${medTableHTML()}
      <div class="p-sec"><h2>Pharmacy</h2><div class="p-grid"><div><b>Pharmacy</b>${esc(p.pharmacy)||"&nbsp;"}</div><div><b>Phone</b>${esc(p.pharmacyPhone)||"&nbsp;"}</div></div></div>
      <div class="p-foot">Caregiver Command Center · Always confirm medicines with the doctor or pharmacist.</div>`);
  }
  function printEmergency(){
    const pf = document.querySelector("[data-form=profile]"); if(pf){ FORMS.profile(new FormData(pf)); save(); }
    const p = state.profile;
    const g = (l,v)=>`<div><b>${l}</b>${esc(v)||"&nbsp;"}</div>`;
    printNow(`${printHead("Emergency information")}
      <div class="p-alert"><strong>Allergies:</strong> ${esc(p.allergies)||"None recorded"}</div>
      <div class="p-grid">${g("Full name",p.name)}${g("Date of birth",p.dob?fmtDate(p.dob):"")}${g("Blood type",p.bloodType)}${g("Height / weight",p.heightWeight)}${g("Preferred language",p.language)}</div>
      <div class="p-sec"><h2>Medical conditions</h2><div>${esc(p.conditions)||"None recorded"}</div></div>
      <div class="p-sec"><h2>Doctor, hospital & pharmacy</h2><div class="p-grid">${g("Primary doctor",p.doctor)}${g("Doctor's phone",p.doctorPhone)}${g("Practice",p.practice)}${g("Preferred hospital",p.hospital)}${g("Pharmacy",p.pharmacy)}${g("Pharmacy phone",p.pharmacyPhone)}</div></div>
      <div class="p-sec"><h2>Emergency contacts (in order to call)</h2>${p.contacts.length?`<table class="p-table"><thead><tr><th>#</th><th>Name & relationship</th><th>Phone</th><th>Notes</th></tr></thead><tbody>${p.contacts.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.notes)}</td></tr>`).join("")}</tbody></table>`:"<p>None recorded.</p>"}</div>
      <div class="p-sec"><h2>Current medications</h2>${medTableHTML()}</div>
      <div class="p-foot">Caregiver Command Center · Keep a copy on the fridge and a photo in your phone's favorites.</div>`);
  }

  /* ================= ACTIONS (delegated) ================= */
  function removeFrom(list, id, msg){
    const idx = list.findIndex(x=>x.id===id); if(idx<0) return;
    const [rm] = list.splice(idx,1); save(); render();
    toast(msg, ()=>{ list.splice(idx,0,rm); save(); render(); });
  }
  const ACTIONS = {
    clearSeed: ()=> confirmDialog("Clear the example data?", "This removes Eleanor's example entries and gives you a blank planner to fill in.", "Clear and start fresh", ()=>{ state = blankState(); save(); render(); toast("All clear. Start with the Profile page."); }, false),
    reset: ()=> confirmDialog("Clear everything?", "This removes every entry on this device (profile, medicines, dose history, appointments, logs) and can't be undone. Save a backup first if you might want anything back.", "Clear everything", ()=>{ state = blankState(); save(); render(); toast("Cleared. Starting fresh."); }),
    dismiss: el=>{ state.dismissed[el.dataset.key] = true; save(); render(); },
    snoozeBackup: ()=>{ state.dismissed.backupUntil = addDays(todayISO(),3); save(); render(); },
    backup: doBackup,
    restore: ()=> document.getElementById("restoreInput").click(),
    medTab: el=>{ ui.medTab = el.dataset.tab; render(); },
    give: el=>{ const iso=el.dataset.iso, key=el.dataset.key; const gi = document.getElementById("giverInput"); if(gi && gi.value.trim()!==state.giver) rememberGiver(gi.value);
      giveDose(iso,key); render(); const m = medById(key.split("@")[0]); toast(`${m?m.name:"Dose"} marked given.`, ()=>{ ungiveDose(iso,key); render(); }); },
    ungive: el=>{ const iso=el.dataset.iso, key=el.dataset.key; const prev = clone(doseEntry(iso,key)); ungiveDose(iso,key); render();
      toast("Marked as not given.", ()=>{ giveDose(iso,key,prev.at); state.doseLog[iso][key].by = prev.by; save(); render(); }); },
    dayDialog: el=> dayDialog(el.dataset.iso),
    histMove: el=>{ const n = Number(el.dataset.n); const end = addDays(ui.histEnd||todayISO(), n); ui.histEnd = end > todayISO() ? null : end; render(); },
    addMed: ()=> medDialog(),
    editMed: el=> medDialog(medById(el.dataset.id)),
    stopMed: el=> stopMedDialog(medById(el.dataset.id)),
    restartMed: el=>{ const m = medById(el.dataset.id); m.status="active"; m.stopDate=""; m.stopReason=""; m.startDate=todayISO(); logChange(m.name,"Restarted"); save(); render(); toast(m.name+" restarted."); },
    delMed: el=>{ const m = medById(el.dataset.id); confirmDialog(`Delete ${esc(m.name)} for good?`, "This removes the medicine and its place in the history grid. Use this only for mistakes. Stopped medicines are usually worth keeping.", "Delete", ()=> removeFrom(state.medications, m.id, m.name+" deleted.")); },
    icsRefill: el=>{ const m = medById(el.dataset.id); download(`refill-${slug(m.name)}.ics`, icsText(`Refill: ${m.name} ${m.dose||""}`.trim(), m.refill, "", state.profile.pharmacy, m.rxNumber?"Rx #"+m.rxNumber:""), "text/calendar"); },
    logPrn: el=> prnDialog(el.dataset.id),
    editPrn: el=> prnDialog(null, state.prnLog.find(p=>p.id===el.dataset.id)),
    delPrn: el=> removeFrom(state.prnLog, el.dataset.id, "Entry deleted."),
    addChange: ()=> changeDialog(),
    delChange: el=> removeFrom(state.medChanges, el.dataset.id, "Entry deleted."),
    printMeds, printEmergency,
    addContact: ()=> contactDialog(),
    editContact: el=> contactDialog(state.profile.contacts.find(c=>c.id===el.dataset.id)),
    delContact: el=> removeFrom(state.profile.contacts, el.dataset.id, "Contact removed."),
    upContact: el=>{ const l = state.profile.contacts, i = l.findIndex(c=>c.id===el.dataset.id); if(i>0){ [l[i-1],l[i]]=[l[i],l[i-1]]; save(); render(); } },
    addAppt: ()=> apptDialog(),
    editAppt: el=> apptDialog(state.appointments.find(a=>a.id===el.dataset.id)),
    delAppt: el=> removeFrom(state.appointments, el.dataset.id, "Appointment deleted."),
    icsAppt: el=>{ const a = state.appointments.find(x=>x.id===el.dataset.id); download(`appointment-${slug(a.doctor)}.ics`, icsText(a.doctor, a.date, a.time, a.location, [a.reason, a.takenBy?"Going: "+a.takenBy:""].filter(Boolean).join("\n")), "text/calendar"); },
    delQ: el=> removeFrom(state.questions, el.dataset.id, "Question deleted."),
    answerQ: el=> answerDialog(state.questions.find(q=>q.id===el.dataset.id)),
    reopenQ: el=>{ const q = state.questions.find(q=>q.id===el.dataset.id); q.asked=false; save(); render(); },
    addDoc: ()=> docDialog(),
    editDoc: el=> docDialog(state.documents.find(d=>d.id===el.dataset.id)),
    delDoc: el=> removeFrom(state.documents, el.dataset.id, "Document removed."),
    addBenefit: ()=>{ const form = document.querySelector("[data-form=insurance]"); if(form) readInsurance(new FormData(form)); state.insurance.benefits.push({id:uid(),name:"",phone:"",ref:""}); save(); render(); },
    delBenefit: el=>{ const form = document.querySelector("[data-form=insurance]"); if(form) readInsurance(new FormData(form)); removeFrom(state.insurance.benefits, el.dataset.id, "Row removed."); },
    addLog: ()=> logDialog(),
    editLog: el=> logDialog(state.dailyLog.find(l=>l.id===el.dataset.id)),
    delLog: el=> removeFrom(state.dailyLog, el.dataset.id, "Entry deleted."),
    addBill: ()=> billDialog(),
    editBill: el=> billDialog(state.bills.find(b=>b.id===el.dataset.id)),
    delBill: el=> removeFrom(state.bills, el.dataset.id, "Bill deleted."),
    payBill: el=>{ const b = state.bills.find(x=>x.id===el.dataset.id), occ = el.dataset.occ; b.paid[occ] = true; save(); render(); toast(`${b.name} marked paid.`, ()=>{ delete b.paid[occ]; save(); render(); }); }
  };
  document.addEventListener("click", e=>{
    const el = e.target.closest("[data-act]"); if(!el) return;
    const fn = ACTIONS[el.dataset.act]; if(fn){ e.preventDefault(); fn(el); }
  });
  const FORMS = {
    profile: fd=>{ const p = state.profile; ["name","dob","bloodType","heightWeight","language","allergies","conditions","doctor","doctorPhone","practice","hospital","pharmacy","pharmacyPhone"].forEach(k=> p[k] = val(fd,k)); toast("Profile saved."); },
    visitChanges: fd=>{ state.visitChanges = val(fd,"visitChanges"); toast("Saved."); },
    addQ: fd=>{ const t = val(fd,"text"); if(!t) return false; state.questions.push({id:uid(), text:t, asked:false, answer:""}); },
    insurance: fd=>{ readInsurance(fd); toast("Insurance info saved."); },
    safetyNotes: fd=>{ state.safetyNotes = val(fd,"notes"); toast("Notes saved."); },
    selfcare: fd=>{ state.selfcare.need = val(fd,"need"); state.selfcare.ask = val(fd,"ask"); toast("Saved."); }
  };
  document.getElementById("main").addEventListener("submit", e=>{
    const f = e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
    const r = FORMS[f.dataset.form] && FORMS[f.dataset.form](new FormData(f));
    if(r===false) return; save(); render();
    if(f.dataset.form==="addQ") setTimeout(()=>{ const i=document.getElementById("newQ"); if(i) i.focus(); },0);
  });
  document.getElementById("main").addEventListener("change", e=>{
    const el = e.target;
    if(el.id==="giverInput"){ rememberGiver(el.value); return; }
    if(el.dataset.change==="safety"){ state.safety[el.dataset.id] = el.checked; save(); render(); return; }
    if(el.dataset.change==="askQ"){ const q = state.questions.find(q=>q.id===el.dataset.id); answerDialog(q); el.checked = false; return; }
  });

  /* ================= RENDER ================= */
  const RENDERERS = { overview:renderOverview, medications:renderMedications, dailyLog:renderDailyLog, profile:renderProfile,
    appointments:renderAppointments, questions:renderQuestions, documents:renderDocuments, insurance:renderInsurance,
    bills:renderBills, safety:renderSafety, selfcare:renderSelfcare, settings:renderSettings };
  function render(){
    const y = window.scrollY;
    renderShell();
    document.getElementById("main").innerHTML = RENDERERS[active]();
    document.title = (SECTIONS.find(s=>s.id===active)||{}).label + " · Caregiver Command Center";
    window.scrollTo({top:y});
  }
  // keep "today" correct if the app is left open past midnight or reopened later
  let lastDay = todayISO();
  function dayCheck(){ if(todayISO()!==lastDay){ lastDay = todayISO(); render(); } }
  setInterval(dayCheck, 60000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) dayCheck(); });
  window.addEventListener("afterprint", ()=>{ document.getElementById("printArea").innerHTML = ""; });

  render();
})();
</script>
</body>
</html>
